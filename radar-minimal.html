<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADS-B Radar Screensaver — Minimal + Terrain</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:700;src:url('vendor/space-grotesk-700.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Space Grotesk';font-weight:400;src:url('vendor/space-grotesk-400.woff2') format('woff2');font-display:swap}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url('vendor/jetbrains-mono-400.woff2') format('woff2');font-display:swap}

:root{
  --bg:#04060c;--ink:#e8f1f8;--dim:#7d8fa5;--cyan:#4fd8eb;
  --green:#3ddc84;--red:#ff5d6c;--amber:#e8b46a;--ink2:#a9bccd;--line:rgba(125,143,165,.18);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Space Grotesk',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  color:var(--ink);font-family:var(--sans);cursor:none;-webkit-font-smoothing:antialiased}
.skyfull{position:relative;width:100vw;height:100vh}
canvas#radar{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}

.sky-br{position:absolute;right:clamp(16px,4vw,56px);bottom:clamp(24px,6vh,60px);
  text-align:right;pointer-events:none;z-index:2;font-family:var(--mono);color:var(--dim)}
.clock{font-size:clamp(28px,3.6vw,46px);color:var(--ink);letter-spacing:.06em}
.date{font-size:11px;letter-spacing:.2em;margin-top:6px;text-transform:uppercase}
.station{font-size:10px;letter-spacing:.2em;margin-top:14px;color:var(--dim)}

/* arrivals list, stacked right above the clock (see CONFIG.arrivalsUrl) */
.arr{margin-bottom:26px;font-size:12px;line-height:16px}
.arr[hidden]{display:none}
.arr-h{font-size:10px;letter-spacing:.2em;margin-bottom:12px}
.arr-h .stale{color:var(--amber)}
.arr-b{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.arr-b.stale{opacity:.5}
.arr-r{display:flex;align-items:baseline;justify-content:flex-end;gap:12px;white-space:nowrap}
.arr-r.landed{opacity:.4}
.arr-tag{font-size:9px;letter-spacing:.08em;color:var(--red)}
.arr-icao{letter-spacing:.04em}
.arr-fl{color:var(--ink2)}
.arr-fl.seen{color:var(--cyan)}
.arr-t{color:var(--ink);min-width:5ch}
.arr-t.late{color:var(--amber)}
.arr-t.off{color:var(--dim)}
.arr-t.cnl{text-decoration:line-through}
.arr-end{font-size:10px;letter-spacing:.2em;margin-top:4px}
</style>
</head>
<body>
<div class="skyfull">
  <canvas id="radar"></canvas>
  <div class="vignette"></div>
  <div class="sky-br">
    <div class="arr" id="arrivals" hidden>
      <div class="arr-h">ARRIVALS<span class="stale" id="arr-stale"></span></div>
      <div class="arr-b" id="arr-body"></div>
    </div>
    <div class="clock"><span id="clk-h">--</span>:<span id="clk-m">--</span>:<span id="clk-s">--</span></div>
    <div class="date" id="hud-date">—</div>
    <div class="station" id="station-label"></div>
  </div>
</div>
<script>
/* =====================================================================
   CONFIG — edit this block to adapt the radar to YOUR station
   ===================================================================== */
const CONFIG = {
  lat: 38.8728,               // receiver latitude  (decimal degrees)
  lon: 1.4015,                // receiver longitude (decimal degrees)
  rangeNM: 150,               // radius of the outer ring, in nautical miles
  centerX: 0.66,              // radar center as fraction of screen width  (0.5 = centered)
  centerY: 0.56,              // radar center as fraction of screen height
  stationLabel: 'LEIB · 38.8728N 1.4015E', // bottom-right corner label
  aircraftUrl: 'api/aircraft',// endpoint returning readsb/dump1090 aircraft.json
  coastUrl: 'examples/coast-example.json', // coastline overlay (see README "Terrain view") — null to disable
  refreshMs: 10000,           // data refresh interval (ms)
  locale: 'en-GB',            // clock, date & number formatting locale (e.g. 'es-ES', 'en-US')
  sweepMs: 3200,              // one full sweep revolution (ms)
  arrivalsUrl: '/dashboard/llegadas/data', // arrivals feed (see README "Arrivals") — null to disable
  arrivalsMax: 5,             // rows in the arrivals list above the clock
  rollMs: 9000,               // "cash register" number roll duration (ms)
  typeMs: 28                  // typewriter effect, ms per character
};
/* ===================================================================== */

const rc = document.getElementById('radar'), rctx = rc.getContext('2d');
const SLAT = CONFIG.lat, SLON = CONFIG.lon, RANGE = CONFIG.rangeNM;
const RDPR = Math.min(devicePixelRatio, 2);
let sweep = 0, blips = [], trails = {}, coast = [];   /* coast: chains of [lon,lat] pairs, converted to NM below */

const toXY = (lat, lon) => [
  (lon - SLON) * Math.cos(SLAT*Math.PI/180) * 60,
  (lat - SLAT) * 60
];
if (CONFIG.coastUrl){
  fetch(CONFIG.coastUrl).then(r => r.json()).then(chains => {
    coast = chains.map(ch => ch.map(([lon, lat]) => toXY(lat, lon)));
  }).catch(() => {});
}

/* "cash register" effect: ease-out interpolation of the displayed number */
function animateNum(el, value, fmt, dur){
  dur = dur || CONFIG.rollMs;
  if (!el) return;
  if (el._animTarget === value){ return; }
  el._animTarget = value;
  const start = isNaN(parseFloat(el._animCurrent)) ? value : parseFloat(el._animCurrent);
  const t0 = performance.now();
  if (el._animId) cancelAnimationFrame(el._animId);
  function step(now){
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const cur = start + (value - start) * e;
    el._animCurrent = cur;
    el.textContent = fmt(cur);
    el._animId = k < 1 ? requestAnimationFrame(step) : null;
  }
  el._animId = requestAnimationFrame(step);
}

/* typewriter: only re-types from the point where the text differs */
function typeText(el, str){
  if (!el || el._typed === str) return;
  const prev = el._typed || '';
  el._typed = str;
  let common = 0;
  while (common < prev.length && common < str.length && prev[common] === str[common]) common++;
  if (el._typeId) clearInterval(el._typeId);
  let i = common;
  el.textContent = str.slice(0, i) + (i < str.length ? '▌' : '');
  el._typeId = setInterval(() => {
    el.textContent = str.slice(0, ++i) + (i < str.length ? '▌' : '');
    if (i >= str.length) clearInterval(el._typeId);
  }, CONFIG.typeMs);
}

function setAircraft(list){
  const now = Date.now();
  blips = list.filter(a => a.lat != null && a.lon != null).map(a => {
    const dy = (a.lat - SLAT) * 60;
    const dx = (a.lon - SLON) * Math.cos(SLAT*Math.PI/180) * 60;
    return {hex:a.hex, x:dx, y:dy, flight:(a.flight||'').trim() || a.hex,
            callsign:(a.flight||'').trim(), reg:a.r || '',
            alt:a.alt_baro, gs:a.gs, track:a.track||0, d:Math.hypot(dx,dy)};
  }).filter(b => b.d <= RANGE*1.5)
    .sort((a,b) => a.d - b.d);
  for (const b of blips){
    (trails[b.hex] = trails[b.hex] || []).push({x:b.x, y:b.y, t:now});
    if (trails[b.hex].length > 40) trails[b.hex].shift();
  }
  for (const h in trails){
    trails[h] = trails[h].filter(p => now - p.t < 300000);
    if (!trails[h].length) delete trails[h];
  }
}

function drawRadar(t){
  const box = rc.parentElement.getBoundingClientRect();
  const bw = Math.floor(box.width*RDPR), bh = Math.floor(box.height*RDPR);
  if (!bw || !bh){ requestAnimationFrame(drawRadar); return; }
  if (rc.width !== bw || rc.height !== bh){ rc.width = bw; rc.height = bh; }
  const W = bw, H = bh, CX = W*CONFIG.centerX, CY = H*CONFIG.centerY;
  const SCALE = Math.max(W,H)*.5/RANGE;
  const maxR = Math.hypot(CX, CY);
  const px2 = b => [CX + b.x*SCALE, CY - b.y*SCALE];
  const pxy = p => [CX + p[0]*SCALE, CY - p[1]*SCALE];
  rctx.clearRect(0,0,W,H);

  /* coastline overlay (optional, see CONFIG.coastUrl) */
  for (const ch of coast){
    rctx.beginPath();
    const [x0, y0] = pxy(ch[0]);
    rctx.moveTo(x0, y0);
    for (let i = 1; i < ch.length; i++){
      const [x, y] = pxy(ch[i]);
      rctx.lineTo(x, y);
    }
    const closed = Math.hypot(ch[0][0]-ch[ch.length-1][0], ch[0][1]-ch[ch.length-1][1]) < .2;
    if (closed){
      rctx.closePath();
      rctx.fillStyle = 'rgba(79,216,235,.045)';
      rctx.fill();
    }
    rctx.strokeStyle = 'rgba(79,216,235,.4)';
    rctx.lineWidth = 1;
    rctx.stroke();
  }

  /* range rings every 25 NM */
  rctx.lineWidth = 1;
  rctx.font = `${10*RDPR}px JetBrains Mono, monospace`;
  for (let nm = 25; nm*SCALE < maxR + 40*RDPR; nm += 25){
    const major = nm % 50 === 0;
    rctx.strokeStyle = major ? 'rgba(79,216,235,.14)' : 'rgba(79,216,235,.06)';
    rctx.beginPath(); rctx.arc(CX, CY, nm*SCALE, 0, 7); rctx.stroke();
    if (major){
      rctx.fillStyle = 'rgba(95,122,134,.65)';
      rctx.textAlign = 'left';
      rctx.fillText(nm+' NM', CX + 5*RDPR, CY - nm*SCALE + 14*RDPR);
    }
  }
  /* bearing radials every 30° */
  rctx.textAlign = 'center';
  for (let i = 0; i < 12; i++){
    const a = i*Math.PI/6;
    rctx.strokeStyle = 'rgba(79,216,235,.07)';
    rctx.beginPath(); rctx.moveTo(CX, CY);
    rctx.lineTo(CX + maxR*Math.sin(a), CY - maxR*Math.cos(a)); rctx.stroke();
    const lr = RANGE*SCALE*.985;
    const lx = CX + lr*Math.sin(a), ly = CY - lr*Math.cos(a);
    if (lx > 20*RDPR && lx < W-20*RDPR && ly > 20*RDPR && ly < H-16*RDPR){
      rctx.fillStyle = 'rgba(95,122,134,.8)';
      rctx.fillText(String(i*30).padStart(3,'0') + '°', lx, ly + 4*RDPR);
    }
  }
  /* outer ring at the configured range */
  rctx.strokeStyle = 'rgba(79,216,235,.28)'; rctx.lineWidth = 1.5;
  rctx.beginPath(); rctx.arc(CX, CY, RANGE*SCALE, 0, 7); rctx.stroke();

  /* sweep */
  sweep = (t/CONFIG.sweepMs) % (Math.PI*2);
  if (rctx.createConicGradient){
    const g = rctx.createConicGradient(sweep - Math.PI/2, CX, CY);
    g.addColorStop(0, 'rgba(79,216,235,.22)');
    g.addColorStop(.10, 'rgba(79,216,235,0)');
    g.addColorStop(1, 'rgba(79,216,235,0)');
    rctx.fillStyle = g;
    rctx.beginPath(); rctx.moveTo(CX, CY); rctx.arc(CX, CY, maxR, 0, 7); rctx.fill();
  }
  rctx.strokeStyle = 'rgba(79,216,235,.7)'; rctx.lineWidth = 1.5;
  rctx.beginPath(); rctx.moveTo(CX, CY);
  rctx.lineTo(CX + maxR*Math.sin(sweep), CY - maxR*Math.cos(sweep)); rctx.stroke();

  /* station marker */
  rctx.fillStyle = '#4fd8eb';
  rctx.beginPath(); rctx.arc(CX, CY, 4*RDPR, 0, 7); rctx.fill();
  rctx.strokeStyle = 'rgba(79,216,235,.5)';
  rctx.beginPath(); rctx.arc(CX, CY, 9*RDPR, 0, 7); rctx.stroke();

  /* position trails */
  for (const h in trails){
    const tr = trails[h];
    for (let i = 1; i < tr.length; i++){
      const [x1,y1] = px2(tr[i-1]), [x2,y2] = px2(tr[i]);
      rctx.strokeStyle = `rgba(79,216,235,${i/tr.length*.35})`;
      rctx.lineWidth = 1;
      rctx.beginPath(); rctx.moveTo(x1,y1); rctx.lineTo(x2,y2); rctx.stroke();
    }
  }

  /* label rectangles already placed this frame, to avoid overlaps */
  const placedLabels = [];
  const rectsOverlap = (a,b) => !(a.x2<b.x1 || a.x1>b.x2 || a.y2<b.y1 || a.y1>b.y2);

  for (const b of blips){
    const [px, py] = px2(b);
    if (px < -30 || px > W+30 || py < -30 || py > H+30) continue;
    const ang = Math.atan2(b.x, b.y);
    let diff = sweep - ((ang % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
    diff = ((diff % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
    const glow = Math.max(.3, 1 - diff/2.4);
    /* arriving at our airport: thin ring, tinted blip and an "ORIGIN → time" line */
    const arr = arrivalFor(b);
    const arrRGB = arr && arr.st === 'div' ? '255,93,108' : '79,216,235';
    if (arr){
      rctx.strokeStyle = `rgba(${arrRGB},${arr.st === 'div' ? .5 : .6})`;
      rctx.lineWidth = 1;
      rctx.beginPath(); rctx.arc(px, py, 13*RDPR, 0, 7); rctx.stroke();
    }
    rctx.save();
    rctx.translate(px, py); rctx.rotate(b.track*Math.PI/180);
    rctx.fillStyle = arr ? `rgba(${arrRGB},${Math.max(.75, glow)})` : `rgba(170,242,255,${glow})`;
    const u = RDPR*5;
    rctx.beginPath();
    rctx.moveTo(0,-u*1.4); rctx.lineTo(u*.85,u); rctx.lineTo(0,u*.4); rctx.lineTo(-u*.85,u);
    rctx.closePath(); rctx.fill();
    rctx.restore();

    const grounded = b.alt === 'ground' || (typeof b.alt === 'number' && b.alt < 0);
    const parked = grounded && (b.gs == null || b.gs < 5);
    const tags = [];
    if (!parked){
      if (!grounded && b.alt >= 0) tags.push('FL' + String(Math.round(b.alt/100)).padStart(3,'0'));
      if (b.gs != null) tags.push(Math.round(b.gs) + ' kt');
    }
    const tagsStr = tags.join(' · ');

    rctx.textAlign = 'left';
    rctx.font = `${10*RDPR}px JetBrains Mono, monospace`;
    const flightW = rctx.measureText(b.flight).width;
    rctx.font = `${8.5*RDPR}px JetBrains Mono, monospace`;
    const tagsW = tagsStr ? rctx.measureText(tagsStr).width : 0;
    const arrStr = arr ? (arr.st === 'div' ? arr.icao + ' · DIV' : arr.icao + ' → ' + arr.time) : '';
    const arrW = arrStr ? rctx.measureText(arrStr).width : 0;
    const labelW = Math.max(flightW, tagsW, arrW);
    const lines = 1 + (tagsStr ? 1 : 0) + (arrStr ? 1 : 0);
    const labelH = (12 + (lines - 1)*11)*RDPR;

    /* candidate positions spiraling outwards (several radii and both sides)
       so labels spread apart in dense areas */
    const cands = [];
    for (const ry of [-6, 16, -26, 36, -46, 56, -66, 76]){
      cands.push({x: 9*RDPR, y: ry*RDPR});
      cands.push({x: -labelW - 9*RDPR, y: ry*RDPR});
    }
    let chosen = cands[0];
    for (const c of cands){
      const rect = {x1: px+c.x, y1: py+c.y-10*RDPR, x2: px+c.x+labelW, y2: py+c.y-10*RDPR+labelH};
      if (!placedLabels.some(p => rectsOverlap(p, rect))){ chosen = c; placedLabels.push(rect); break; }
    }

    rctx.fillStyle = `rgba(225,248,255,${Math.min(1, glow*1.05)})`;
    rctx.font = `${10*RDPR}px JetBrains Mono, monospace`;
    rctx.fillText(b.flight, px + chosen.x, py + chosen.y);
    if (tagsStr){
      rctx.fillStyle = `rgba(165,210,228,${glow*.95})`;
      rctx.font = `${8.5*RDPR}px JetBrains Mono, monospace`;
      rctx.fillText(tagsStr, px + chosen.x, py + chosen.y + 12*RDPR);
    }
    if (arrStr){
      const rgb = arr.st === 'div' ? '255,93,108' : arr.late ? '232,180,106' : '79,216,235';
      rctx.fillStyle = `rgba(${rgb},${Math.max(.7, glow)})`;
      rctx.font = `${8.5*RDPR}px JetBrains Mono, monospace`;
      rctx.fillText(arrStr, px + chosen.x, py + chosen.y + (tagsStr ? 23 : 12)*RDPR);
    }
  }
  requestAnimationFrame(drawRadar);
}
requestAnimationFrame(drawRadar);

/* clock: typewriter on first paint, cash-register roll on every following second */
let clockStarted = false;
const pad2 = v => String(Math.round(v)).padStart(2, '0');
function tick(){
  const now = new Date();
  const hEl = document.getElementById('clk-h'), mEl = document.getElementById('clk-m'), sEl = document.getElementById('clk-s');
  if (!clockStarted){
    clockStarted = true;
    typeText(hEl, pad2(now.getHours()));
    typeText(mEl, pad2(now.getMinutes()));
    typeText(sEl, pad2(now.getSeconds()));
  } else {
    animateNum(hEl, now.getHours(), pad2, 500);
    animateNum(mEl, now.getMinutes(), pad2, 500);
    animateNum(sEl, now.getSeconds(), pad2, 500);
  }
  typeText(document.getElementById('hud-date'), now.toLocaleDateString(CONFIG.locale,
    {weekday:'long', day:'2-digit', month:'long'}));
}
tick();
setInterval(tick, 1000);

/* static texts: typed once on startup */
typeText(document.getElementById('station-label'), CONFIG.stationLabel);

/* =====================================================================
   ARRIVALS — today's arrivals at the station's airport, listed above the
   clock; the ones visible on the radar are also marked on their blip.
   Feed: {ok, vuelos:[{vuelo, matricula, origen_icao, prog, eta, estado,
   retraso_min}], viejo, leido} (see README "Arrivals").
   ===================================================================== */
let arrFlights = null;          /* last good list from the feed, null until the first one */
let arrReadAt = 0, arrOld = false, arrIndex = new Map();
const LATE_MIN = 3;             /* from this delay on, the time is shown in amber */
const STALE_MS = 10*60000;      /* no fresh data for this long → "NOT UPDATED SINCE" */
const normId = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const hmMin = t => { const p = String(t || '').split(':'); return p.length === 2 ? (+p[0])*60 + (+p[1]) : null; };
/* IATA → ICAO airline prefixes, so a flight number like "VY 3916" also matches
   the ADS-B callsign "VLG3916" when the receiver doesn't know the registration */
const ICAO_OF = {VY:['VLG'],FR:['RYR'],U2:['EZY','EJU','EZS'],IB:['IBE'],I2:['IBS'],UX:['AEA'],
  LS:['EXS'],BY:['TOM'],X3:['TUI'],HV:['TRA'],TO:['TVF'],BA:['BAW'],EW:['EWG'],LH:['DLH'],
  LX:['SWR'],AF:['AFR'],KL:['KLM'],OS:['AUA'],DY:['NAX','NSZ'],YW:['ANE'],V7:['VOE'],
  W6:['WZZ'],DE:['CFG'],WK:['EDW'],EI:['EIN'],SN:['BEL'],AZ:['ITY'],TP:['TAP'],SK:['SAS']};

function arrState(v){
  if (v.estado === 'en_vuelo') return 'air';
  if (v.estado === 'aterrizado' || v.estado === 'en_calzos') return 'landed';
  if (v.estado === 'cancelado') return 'cnl';
  if (v.estado === 'desviado') return 'div';
  return 'sched';
}
function arrKeys(v){
  const keys = [normId(v.matricula), normId(v.vuelo)];
  const m = normId(v.vuelo).match(/^([A-Z0-9]{2})(\d{1,4}[A-Z]?)$/);
  if (m && ICAO_OF[m[1]]) for (const p of ICAO_OF[m[1]]) keys.push(p + m[2].replace(/^0+/, ''));
  return keys.filter(Boolean);
}
function arrivalFor(b){
  if (!arrIndex.size) return null;
  return arrIndex.get(normId(b.reg)) || arrIndex.get(normId(b.callsign)) || null;
}

function renderArrivals(){
  const box = document.getElementById('arrivals');
  if (!arrFlights){ box.hidden = true; return; }
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const fmt = m => String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  const items = [];
  arrIndex = new Map();
  for (const v of arrFlights){
    const st = arrState(v);
    const prog = hmMin(v.prog);
    let eta = hmMin(v.eta);
    if (eta != null && prog != null && eta < prog - 720) eta += 1440;   /* delayed past midnight */
    const t = (st === 'cnl' || st === 'div' || eta == null) ? prog : eta;
    if (t == null) continue;
    const late = (st === 'air' || st === 'sched') &&
      ((typeof v.retraso_min === 'number' ? v.retraso_min : (eta != null && prog != null ? eta - prog : 0)) >= LATE_MIN);
    const it = {v, st, t, late, icao: v.origen_icao || '····', time: fmt(t)};
    if (st !== 'landed' && st !== 'cnl') for (const k of arrKeys(v)) arrIndex.set(k, it);
    /* landed: only the last 15 min; the rest: until 20 min past their time (in the air: always) */
    if (st === 'landed' ? nowMin - t <= 15 : (st === 'air' || t >= nowMin - 20)) items.push(it);
  }
  items.sort((a, b) => a.t - b.t);
  const rows = items.slice(0, CONFIG.arrivalsMax);
  const pending = items.filter(i => i.st !== 'landed').length;
  const shownPending = rows.filter(i => i.st !== 'landed').length;

  /* flights whose aircraft is on the radar right now get their number in cyan */
  const seen = new Set();
  for (const b of blips){ const a = arrivalFor(b); if (a && a.st !== 'div') seen.add(a); }

  const body = document.getElementById('arr-body');
  body.replaceChildren();
  const span = (cls, txt) => { const s = document.createElement('span'); s.className = cls; s.textContent = txt; return s; };
  for (const it of rows){
    const r = document.createElement('div');
    r.className = 'arr-r' + (it.st === 'landed' ? ' landed' : '');
    if (it.st === 'cnl' || it.st === 'div') r.append(span('arr-tag', it.st === 'cnl' ? 'CNL' : 'DIV'));
    r.append(span('arr-icao', it.icao),
             span('arr-fl' + (seen.has(it) ? ' seen' : ''), normId(it.v.vuelo) || '—'),
             span('arr-t' + (it.late ? ' late' : '') + (it.st === 'cnl' || it.st === 'div' ? ' off' : '') + (it.st === 'cnl' ? ' cnl' : ''), it.time));
    body.append(r);
  }
  if (pending === shownPending) body.append(span('arr-end', 'NO MORE ARRIVALS TODAY'));

  const stale = arrOld || Date.now() - arrReadAt > STALE_MS;
  const readAt = new Date(arrReadAt);
  document.getElementById('arr-stale').textContent = stale
    ? ' · NOT UPDATED SINCE ' + fmt(readAt.getHours()*60 + readAt.getMinutes()) : '';
  body.classList.toggle('stale', stale);
  box.hidden = false;
}

async function refreshArrivals(){
  try{
    const d = await (await fetch(CONFIG.arrivalsUrl, {cache:'no-store', credentials:'same-origin'})).json();
    if (d && d.ok && Array.isArray(d.vuelos)){
      arrFlights = d.vuelos;
      arrOld = !!d.viejo;
      arrReadAt = d.leido ? d.leido*1000 : Date.now();
    }
  }catch(e){}            /* keep the last good list; it shows as stale after STALE_MS */
  renderArrivals();
}
if (CONFIG.arrivalsUrl){
  refreshArrivals();
  setInterval(refreshArrivals, 60000);
}

async function refresh(){
  try{
    const a = await (await fetch(CONFIG.aircraftUrl)).json();
    if (a.aircraft) setAircraft(a.aircraft);
  }catch(e){}
  if (arrFlights) renderArrivals();
}
refresh();
setInterval(refresh, CONFIG.refreshMs);
</script>
</body>
