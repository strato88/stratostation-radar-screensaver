name: Deploy to production

# Runs scripts/desplegar.sh on YOUR OWN self-hosted runner (registered on the station server, see
# "Continuous deployment" in README.md) whenever main changes. It updates the
# production clone and, if you use the bundled systemd unit, restarts it.
#
# This never runs on GitHub-hosted runners: without a self-hosted runner
# registered for this repo, the job just stays queued and does nothing.
#
# A production clone can carry permanent local customizations (a hand-edited
# CONFIG block, extra pages, whatever) that will never match main — that's
# expected, not an error. So this fast-forwards when it can, does a real merge
# when main and the local customizations don't overlap, and only when the same
# lines are touched on both sides does it back out cleanly (never leaving
# conflict markers live in files the server is serving) and fail the job so
# you get notified and can resolve it by hand over SSH.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # The deploy logic lives in scripts/desplegar.sh, which you can also run
      # by hand on the server; running it from this checkout means the job
      # always uses the script of the commit being deployed.
      - uses: actions/checkout@v4

      - name: Update the production clone (scripts/desplegar.sh)
        run: |
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Repository variable DEPLOY_PATH is not set. See 'Continuous deployment' in README.md."
            exit 1
          fi
          bash scripts/desplegar.sh
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
